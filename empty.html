<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비서 - 404 페이지를 찾을 수 없습니다</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85'>🧭</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff'); font-weight: 700; font-display: swap; }
    html { font-family: "GMarketSans"; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <!-- 상단부 헤더 (nav 및 버튼 구성 유지) -->
  <header class="sticky top-0 z-50 w-full bg-white border-b border-slate-200 py-3.5 px-4 sm:px-8">
    <div class="max-w-[1560px] mx-auto flex items-center justify-between">
      <!-- 좌측 로고 -->
      <a href="./index.html" class="flex items-center cursor-pointer shrink-0 gap-3">
        <img src="./images/logo_white.png" alt="로고" class="w-10 h-10 rounded-xl object-cover shadow-lg shadow-blue-300 hover:scale-105 transition-transform">
        <span class="text-base font-bold text-slate-700">개인비서</span>
      </a>
      <!-- 우측 검색창 및 버튼 구성 -->
      <div class="flex items-center gap-1.5">
        <button id="btn-settings" class="p-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors focus:outline-none">
        </button>
      </div>
    </div>
  </header>

  <!-- 404 에러 안내 메인 영역 -->
  <main class="w-full flex-1 flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-2xl shadow-xs border border-slate-200 flex flex-col items-center">
      <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-4xl mb-6 shadow-inner">
        🧭
      </div>
      
      <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full mb-3">404 Not Found</span>
      
      <h1 class="text-4xl sm:text-5xl font-black text-slate-800 tracking-tight mb-3">404</h1>
      <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2">페이지를 찾을 수 없습니다</h2>
      
      <p class="text-xs sm:text-sm text-slate-500 leading-relaxed mb-8">
        요청하신 페이지가 삭제되었거나 주소가 변경되어<br class="hidden sm:inline"> 찾을 수 없습니다. 주소를 다시 한번 확인해 주세요.
      </p>

      <!-- 이동 버튼 그룹 -->
      <div class="flex flex-col sm:flex-row gap-3 w-full justify-center">
        <button onclick="history.back()" class="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold transition-colors cursor-pointer inline-flex items-center justify-center gap-1.5 shadow-xs">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          이전 페이지
        </button>
        <a href="./index.html" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold transition-colors cursor-pointer inline-flex items-center justify-center gap-1.5 shadow-xs">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          홈으로 가기
        </a>
      </div>
    </div>
    
    <footer class="mt-8 text-xs text-slate-400">
      &copy; 개인비서. All rights reserved.
    </footer>
  </main>
</body>
</html>
